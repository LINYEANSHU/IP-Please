name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CI: 'true'
      IP_PLEASE_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium chrome
      - name: Browser regression (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- --max-failures=1
      - name: Browser regression (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e -- --max-failures=1
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
